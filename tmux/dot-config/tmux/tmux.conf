# Set true color
set-option -ga terminal-overrides ",xterm*:RGB"
set -g default-terminal "tmux-256color"

# Enable mouse
set -g mouse on

set -g status-position bottom
set -gq allow-passthrough on

# Clipboard
set -g set-clipboard on
set -s copy-command 'wl-copy'

bind Escape copy-mode
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X rectangle-toggle
# unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

# bind-key -T copy-mode-vi v send-keys -X begin-selection
# bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ============================================================================
# OpenCode AI Assistant Integration
# ============================================================================
# C-o: Toggle OpenCode interface (smart detection of running instance)
# O:   Show OpenCode help and commands
# C-O: OpenCode session management
# M-o: Send current pane content to OpenCode
# C-M-o: Send git status to OpenCode
# M-O: Analyze current project with OpenCode
# ============================================================================

bind-key C-o if-shell "pgrep -f 'opencode.*run' > /dev/null" \
  "display-popup -d '#{pane_current_path}' -w 95% -h 95% -b rounded -E 'opencode'" \
  "display-popup -d '#{pane_current_path}' -w 95% -h 95% -b rounded -E 'opencode run'"

# Quick opencode help
bind-key O display-popup -d '#{pane_current_path}' -w 70% -h 50% -b rounded \
  -E "echo '🤖 OpenCode Commands:' && echo '' && echo 'C-o: Toggle OpenCode interface' && echo 'C-O: Session management' && echo 'O:   Show this help' && echo '' && echo 'Press Enter to continue...' && read"

# Opencode session management with better error handling
bind-key C-O display-popup -d '#{pane_current_path}' -w 85% -h 70% -b rounded \
  -E "if command -v opencode >/dev/null 2>&1; then echo '🤖 OpenCode Session Management'; echo '═══════════════════════════════'; opencode session list 2>/dev/null || echo 'No active sessions. Start with C-o'; echo ''; echo 'Recent commands:'; opencode --help 2>/dev/null | grep -A 5 'COMMANDS:' | head -10; else echo 'OpenCode not found. Install from https://opencode.ai'; fi; echo ''; echo 'Press Enter to close...' && read"

# Send current pane content to opencode
bind-key M-o run-shell "tmux capture-pane -p -S - | opencode prompt 'Analyze this terminal output:' 2>/dev/null || echo 'OpenCode not running or not available'"

# Quick opencode with git context
bind-key C-M-o run-shell "cd '#{pane_current_path}' && if git rev-parse --git-dir >/dev/null 2>&1; then git status --porcelain | opencode prompt \"Git status for $(basename \"#{pane_current_path}\"):\" 2>/dev/null || echo 'OpenCode not running'; else echo 'Not in a git repository'; fi"

# Opencode project analysis
bind-key M-O display-popup -d '#{pane_current_path}' -w 90% -h 80% -b rounded \
  -E "cd '#{pane_current_path}' && echo '🤖 Analyzing project: #{pane_current_path}' && echo '══════════════════════════════════════════════' && echo 'Directory structure:' && find . -maxdepth 2 -type f | head -20 && echo '' && echo 'Git status:' && git status --porcelain 2>/dev/null || echo 'Not a git repository' && echo '' && echo 'Press Enter to send to OpenCode...' && read && (echo 'Please analyze this project structure and git status:' && echo '' && pwd && echo '' && ls -la && echo '' && git status 2>/dev/null) | opencode prompt - 2>/dev/null || echo 'Failed to send to OpenCode'"

bind-key C-t run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --prompt 'A ' \
    --header ' ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(A )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(T )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(G )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(X )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(F )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(D )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind-key C-g display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"

bind-key C-f display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "yazi"

set -g detach-on-destroy off

bind-key x kill-pane

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Set prefix
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Split panes
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'o0th/tmux-nova'
# set -g @plugin 'tmux-plugins/tmux-yank'

# Set vi-mode
setw -g mode-keys vi

set -g @resurrect-save 'C-s'
set -g @resurrect-restore 'C-r'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'bash'

# Theme config
set -g @nova-nerdfonts true
set -g @nova-nerdfonts-left ''
set -g @nova-nerdfonts-right ''
set -g @nova-pane-active-border-style '#44475a'
set -g @nova-pane-border-style '#282a36'
set -g @nova-status-style-bg '#4c566a'
set -g @nova-status-style-fg '#d8dee9'
set -g @nova-status-style-active-bg '#89c0d0'
set -g @nova-status-style-active-fg '#2e3540'
set -g @nova-status-style-double-bg '#2d3540'
set -g @nova-pane '#I#{?pane_in_mode, #{pane_mode},} #W'
set -g @nova-segment-mode '#{?client_prefix,C,I}'
set -g @nova-segment-mode-colors "#232831 #d8dee9"
set -g @nova-segment-session '#S'
set -g @nova-segment-session-colors "#A3BE8C #2E3440"
# Opencode status indicator - shows when in opencode pane
set -g @nova-segment-opencode '#{?#{m:*opencode*,#{pane_current_command}},🤖,}'
set -g @nova-segment-opencode-colors "#F28FAD #2E3440"
set -g @nova-rows 0
set -g @nova-segments-0-left 'mode'
set -g @nova-segments-0-right 'opencode session'

run '~/.tmux/plugins/tpm/tpm'
